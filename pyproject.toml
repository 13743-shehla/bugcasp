[project]
name = "bugcasp"
version = "2.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3", "passlib[bcrypt]==1.7.4", "bcrypt==4.0.1",
  "email-validator>=2.2,<3", "dnspython>=2.6,<3", "disposable-email-domains>=0.0.100",
  "python-multipart>=0.0.18", "pypdf>=5,<7", "httpx>=0.27,<1", "Pillow>=11,<13"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
